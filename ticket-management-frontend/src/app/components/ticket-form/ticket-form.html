<form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Título:</label>
    <input formControlName="title" placeholder="Título">
  </div>
  <div>
    <label>Descripción:</label>
    <input formControlName="description" placeholder="Descripción">
  </div>
  <button type="submit" [disabled]="ticketForm.invalid">Crear Ticket</button>
</form>
